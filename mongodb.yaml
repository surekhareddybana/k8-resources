apiVesrion: apps/v1
kind: Deployment
metadata:
  name: roboshop-deployment
  namespace: roboshop
  labels: 
    project: roboshop
    tier: database
    purpose: database-mongo
spec:
 replicas: 1
 selector:
    matchLabels:
      project: roboshop
      tier: database
      purpose: database-mongo
 template:
       metadata:
          labels:
             project: roboshop
             tier: database
             purpose: database-mongo
       spec:
         containers:
         - name: mongo
           image: mongo
           ports: 
           - containerPort: 27017