apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-static
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  
  storageClassName: "" #this should be emmpty in static provisioning
  PersistentVolumeReclaimpolicy: Retain
  csi:
    driver: ebs.csi.aws.com
    
    volumeHandle: vol-03c604538dd7d2f41
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-static
spec:
  storageClassName: "" # Empty string must be explicitly set otherwise default StorageClass will be set
  volumeName: test-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---

apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels: 
     purpose: efs-static-demo
     project: roboshop
spec:
  
  containers:
  - name: nginx
    image: nginx
    volumeMounts: # this is in docker docker run -v host-path:container-path
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: efs-static
---
# if u want to see this nginx app to outside either nodeport or load balancer

apiVersion: v1
kind: Service
metadata:
  name: efs-static
  labels:
    purpose: efs-static-demo
    project: roboshop

spec:
  type: nodeport
  selector:
   purpose: efs-static-demo
   project: roboshop
  ports: 
    - protocol: TCP
      port: 80 #service port
      targetport: 80 # container port
 
  